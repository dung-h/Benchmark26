# Analytical Duration Routes Configuration
schema_version: "1.0"
study_id: "unified_analytical_duration_routes_v1"

variants:
  raw:
    description: "Raw analytical score directly from operation graph / recurrence"
    units: "seconds (Qiskit/QCRE) or unitless score (NoTaDS)"
  shot_scaled:
    description: "Raw score multiplied by execution shots count"
    units: "seconds or unitless"
  affine_calibrated:
    description: "Linear affine fit y = a * score + b fit strictly on outer-train folds"
    constraint: "Non-negative projection max(pred, 0)"
    units: "seconds"
  log_affine_calibrated:
    description: "Log-domain affine fit log(y) = a * log(score) + b on outer-train folds"
    units: "seconds"

resampling:
  method: "paired_group_disjoint_bootstrap"
  draws: 10000
  random_seed: 42
  significance_level: 0.05
  contrast_adjustment: "conservative_paired_interval"

fixtures:
  archived_graph_fixtures_count: 10
  kernel_test_command: "python3 scripts/verify_analytical_kernel.py"
  compiler: "g++"
