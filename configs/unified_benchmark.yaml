# Canonical Experimental Configuration: Unified QPU Benchmark
schema_version: "1.0"
study_id: "unified_qpu_runtime_benchmark_v1"

cohort:
  total_observations: 3443
  total_logical_groups: 203
  evaluation_unit: "logical-circuit group (group_id / structural_group)"
  sources:
    mali_real_qpu:
      observations: 340
      logical_groups: 148
      target_clock: "reported_execution_time_seconds"
    qonductor_single_circuit_ibm:
      observations: 3058
      logical_groups: 49
      target_clock: "job_execution_duration_seconds"
      qualification_criteria: "PASS_PREPARED_READOUT_STATE (MQT 1.0.3)"
    qpack_mcp:
      observations: 45
      constituent_timings: 3854
      logical_groups: 6
      target_clock: "workflow_arithmetic_mean_seconds"

splits:
  strategy: "group_disjoint_holdout"
  leakage_guard: "Circuits sharing logical structure (even with varying parameter angles) never cross train/test splits"
  evaluations:
    E1:
      description: "Logical-circuit group holdout (strict unseen-structure evaluation)"
      outer_folds: 5
      inner_folds: 4
    E2:
      description: "Source-stratified random holdout (allows intended group overlap)"
      outer_folds: 5
      inner_folds: 4
    E3:
      description: "QPU backend holdout (generalization across quantum backends)"
      outer_folds: 5
      inner_folds: 4
  seeds:
    training: [42, 43, 44]
    inner_validation: 0
    bootstrap_resampling: 42

methods:
  neural:
    epochs: 500
    optimizer: "Adam"
    learning_rate: 0.0005
    weight_decay: 0.0001
    loss: "unweighted raw-seconds MSE"
    architectures:
      G1: "Graph-augmented MLP (51 global features + TransformerConv node embeddings)"
      G2: "Graph-augmented MLP with explicit shot scaling"
      M0: "Baseline MLP on 51 global features"
      M1: "Matched MLP on global features with shot input"
  classical:
    R0: "Qonductor validation-based selector (picks best model family per outer fold via inner validation)"
    median: "Outer-train target median baseline"
  analytical:
    qiskit_target: "Backend target nominal duration accumulation"
    qcre_unitary: "Critical-path operation duration sum"
    notads: "Operation DAG filtered-depth analytical score"
    ibm_usage: "IBM cloud usage metric diagnostics"

evaluation:
  metric_weightings:
    - pooled: "Standard unweighted mean across all observations"
    - source_balanced: "Macro-average across dataset sources (1/3 weight each)"
    - group_balanced: "Mean of group-level mean errors (equal weight per logical group)"
  reported_metrics:
    - MAE
    - MedAE
    - RMSE
    - R2_raw
    - log1p_MAE
    - p90_absolute_error
    - p99_absolute_error
    - max_absolute_error
    - negative_prediction_count
