name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install review dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate source and protocol files
        run: make check
      - name: Run unit tests
        run: make test
