[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark26"
version = "0.1.0"
description = "Reproducible tooling for the Quantum Runtime Estimation Benchmark"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy==1.26.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]
research = [
  "scipy",
  "scikit-learn",
  "qiskit",
  "qiskit-ibm-runtime",
  "torch",
  "torch-geometric",
  "openqasm3",
]

[tool.pytest.ini_options]
testpaths = [
  "research",
]
python_files = [
  "test_*.py",
]
pythonpath = [
  "research/postfreeze_qpu_workflow_mean_cost_v1",
  "research/postfreeze_qpu_workflow_mean_expansion_v1",
]
addopts = "-q"

[tool.setuptools]
py-modules = []
