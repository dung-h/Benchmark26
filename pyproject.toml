[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark26"
version = "0.2.0"
description = "A unified, leakage-safe quantum program runtime estimation benchmark on physical QPUs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Dung Hoang", email = "author@example.com" }
]
keywords = [
  "quantum-computing",
  "runtime-estimation",
  "qpu-benchmark",
  "graph-neural-networks",
  "reproducibility"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy>=1.24.0,<=1.26.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]
dev = [
  "pytest>=8.0,<9.0",
]
analysis = [
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "pandas>=2.0.0",
]
full = [
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "pandas>=2.0.0",
  "qiskit>=1.0.0",
  "qiskit-ibm-runtime>=0.20.0",
  "torch>=2.0.0",
  "torch-geometric>=2.4.0",
  "openqasm3>=0.5.0",
]

[project.urls]
"Homepage" = "https://github.com/dung-h/Benchmark26"
"Documentation" = "https://github.com/dung-h/Benchmark26/tree/main/docs"
"Repository" = "https://github.com/dung-h/Benchmark26.git"
"Bug Tracker" = "https://github.com/dung-h/Benchmark26/issues"

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "research",
]
python_files = [
  "test_*.py",
]
pythonpath = [
  ".",
  "tests",
  "benchmark_v1/scripts",
  "research/postfreeze_qpu_workflow_mean_cost_v1",
  "research/postfreeze_qpu_workflow_mean_expansion_v1",
]
addopts = "-q"

[tool.setuptools]
py-modules = []
