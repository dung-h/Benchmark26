[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark26"
version = "0.3.0"
description = "Code and aggregate results for comparing QPU runtime estimators on 3,443 archived observations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dung Hoang" }]
keywords = ["quantum computing", "runtime estimation", "benchmark", "reproducibility"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.24,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# Packages used by the research runners; each runner records the versions it used.
research = [
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "qiskit>=0.45",
  "qiskit-ibm-runtime>=0.20",
  "torch>=2.0",
  "torch-geometric>=2.4",
]

[project.urls]
Repository = "https://github.com/dung-h/Benchmark26"

[tool.setuptools]
packages = ["benchmark26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "experiments/qpu"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["protocols/reference_code"]
